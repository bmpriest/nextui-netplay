# DSperate settings for MinUI, seeded once from the pak's one-stick profile.
#
# This file is yours after the first launch: the pak writes it only when
# .userdata/<platform>/DSP-dsperate/device.txt does not already name this
# profile, so anything changed here or in DSperate's own pause menu survives.
# Delete device.txt to seed it again from the pak.
#
# Two files next to this one override it for a single game:
# games/<rom name>.ini and games/<GAMECODE>.ini, the filename one winning.
# A layout picked with the hotkey is remembered in the filename one.
#
# configs/reference.ini in the pak lists every key with its default.

[paths]
bios9 = __BIOS_PATH__/bios9.bin
bios7 = __BIOS_PATH__/bios7.bin
firmware = __BIOS_PATH__/firmware.bin
games = __ROMS_PATH__
saves = __SAVES_PATH__
states = __STATES_PATH__
screenshots = __SCREENSHOTS_PATH__
cheats = __CHEATS_PATH__

[video]
fullscreen = true
pip_alpha = 0.67

[audio]
# No MinUI handheld has a microphone wired up that DSperate can open.
mic = false

[emu]
# Name states after the ROM rather than the four-letter game code, so they line
# up with what the launcher keys its own files on and two hacks of one game do
# not share slots.
state_key = rom
# cpu_oc and fast_load trade a little accuracy for speed. Turn these off first
# if a game hangs, desyncs or glitches.
cpu_oc = true
fast_load = true
# Write a state on exit and resume from it next launch, so the launcher's
# SIGTERM does not lose progress.
autosave = true
autoload = true
frameskip = 1

[pad]
# The pak exports positional mappings itself (platform.sh); the kernel codes
# face_fix would check them against are not positional on these pads.
face_fix = off
# Left stick only: it drives the pen, so the d-pad keeps the DS d-pad.
stylus_axis = left
stylus_button = +lefttrigger
stylus_button.alt = leftstick

[hotkeys]
# No keyboard on these devices; the pad hotkeys below are the real ones.
quit = none

[padhotkeys]
# The modifier is the MENU button, mapped to SDL's "guide" by the pak.
quit = mod+a
pause = mod+y
fast_forward = +righttrigger
fast_forward_toggle = mod++righttrigger
layout_next = mod+dpup
layout_prev = mod+dpdown
screen_swap = mod++lefttrigger
screenshot = mod+b
fps = mod+x
# Save, leave, and have the launcher come back up on its game switcher. Unbound
# upstream, where mod+back is layout_next; free here because layout_next is on
# the d-pad above.
game_switcher = mod+back

[cheevos]
enabled = true
