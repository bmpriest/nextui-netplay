# Profiling is emitted to MGBA.txt by the paired core, so the on-screen debug HUD
# no longer needs to consume rendering time or obscure normal gameplay.
minarch_debug_hud = Off

# Pin the clock so measurements are comparable. CPU Speed=Auto leaves the
# `conservative` governor at up_threshold=80, and one mGBA instance sits just
# under that, so it parks below the 1344MHz cap and inflates every number.
minarch_cpu_speed = Performance

# Match the Brick's normal NextUI default. The option remains user-selectable;
# this only replaces the old profiling-oriented Fullscreen default.
minarch_screen_scaling = Aspect
