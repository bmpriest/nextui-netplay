# The spruce test rig. Copy to rig.conf (ignored by git) and fill in.
# Passwords never go here: the spruce password comes from $DEVBRIDGE_PASSWORD.

# NextUI Brick that serves the ad hoc network for the two spruce devices, on
# USB ADB. Root SSH with a key on its house address carries the tunnel to the
# RG35XXH once that has left the house network.
AP_ADB=USB-SERIAL-OF-NEXTUI-BRICK
AP_LAN=192.168.0.143

# spruce Brick, on USB ADB. It hosts every session.
BRICK_ADB=USB-SERIAL-OF-SPRUCE-BRICK

# spruce RG35XXH: its house address, for setup and the NextUI-against-spruce
# tests. On the ad hoc network it is reached through the tunnel below.
H700_LAN=192.168.0.44
TUNNEL_ADDR=127.0.0.2
TUNNEL_PORT=2222

# Optional: DevBridge.pak checkout (default ../DevBridge.pak beside this repo)
# and where runs are kept (default testing/results/spruce).
#DEVBRIDGE=
#OUT=
